spring.application.name=watchtower-backend
server.port=${PORT:8080}

watchtower.weather.base-url=${WEATHER_PROVIDER_URL:https://api.open-meteo.com/v1/forecast}
watchtower.weather.connect-timeout=3s
watchtower.weather.read-timeout=8s
watchtower.weather.cache-ttl=${WEATHER_CACHE_TTL:5m}
watchtower.weather.cache-max-entries=500
watchtower.cors.allowed-origins=${WATCHTOWER_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Keep provider diagnostics in server logs, not in HTTP error responses.
server.error.include-message=never
server.error.include-stacktrace=never
